"338-1":["The submission is incomplete, missing nearly all required form fields, validation attributes, and the challenge tasks.","The HTML markup contains severe syntax errors, unclosed tags, and fragmented elements like '&lt;lab'.","Your submission is incomplete and contains broken HTML syntax. You need to include all requested form fields, validation attributes, fieldsets, and challenge task requirements to pass this project."],

const tot=(q)=>q?q[0]+10+q[1]:0, cls=(p)=>p>=.7?'g':p>=.45?'y':'r';

 [S.length,'students'],[(sum(S.map(s=>s.t))/sum(S.map(s=>s.a))).toFixed(1)+'/30','avg per question'],

 [S.filter(s=>s.a<4).length,'with missing submissions']
].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');

 a.sort((x,y)=>o=='hi'?y.t/ (y.a||1)-x.t/(x.a||1):o=='lo'?x.t/(x.a||1)-y.t/(y.a||1):x[0].localeCompare(y[0]));
 L.innerHTML=a.map(s=>{
  const p=s.t/(s.a*30);
  const rows=s[2].map((q,i)=>{
   if(f&&f!=i+1)return'';
   if(!q)return`<div class="q"><div class="t"><span>${QN[i]}</span><span class="r">Not submitted</span></div></div>`;
   const t=tot(q);
   return`<div class="q"><div class="t"><span>${QN[i]}</span><span class="${cls(t/30)}">${t}/30</span></div><div class="m">Correctness ${q[0]}/10 · Design 10/10 · Code quality ${q[1]}/10</div>${(d=>d?`<div class="i"><b>Correctness feedback:</b> ${d[0]}</div><div class="i"><b>Code quality feedback:</b> ${d[1]}</div><div class="i"><b>Overall summary:</b> ${d[2]}</div>`:`<div class="i">${q[2]}</div>`)(F[s[1]+'-'+i])}</div>`}).join('');
  return`<div class="card"><div class="hd" tabindex="0" role="button"><div class="n"><b>${s[0]}</b><small>UID ${s[1]} · ${s.a}/4 submitted</small></div><span class="pill ${cls(p)}">${(p*100).toFixed(0)}%</span><span class="tot ${cls(p)}">${s.t}/${s.a*30}</span></div><div class="body">${rows}</div></div>`}).join('')||'<p class="sub">No matches.</p>';
}
L.addEventListener('click',e=>{const h=e.target.closest('.hd');if(h)h.parentNode.classList.toggle('open')});

render();
